services:
  builder:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.builder
    image: rinha26-builder:dev
    volumes:
      - ../data:/data:ro
      - index:/index
    command: ["/data/references.json.gz", "/index/index.bin"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"

  api1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: rinha26-api:dev
    volumes:
      - index:/index:ro
      - sockets:/sockets
    command: ["/sockets/api1.sock", "/index/index.bin", "1"]
    depends_on:
      builder:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "160M"

  api2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: rinha26-api:dev
    volumes:
      - index:/index:ro
      - sockets:/sockets
    command: ["/sockets/api2.sock", "/index/index.bin", "1"]
    depends_on:
      builder:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "160M"

  lb:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.lb
    image: rinha26-lb:v2
    command: ["0.0.0.0:9999", "/sockets/api1.sock", "/sockets/api2.sock"]
    volumes:
      - sockets:/sockets:ro
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "30M"

volumes:
  index:
  sockets:
