global
    maxconn 20000
    nbthread 1

defaults
    mode http
    no log
    option dontlognull
    retries 1
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout queue 30s

frontend main
    bind *:9999 backlog 4096
    default_backend api

backend api
    balance roundrobin
    default-server maxconn 3000
    server api1 unix@/sockets/api1.sock
    server api2 unix@/sockets/api2.sock
