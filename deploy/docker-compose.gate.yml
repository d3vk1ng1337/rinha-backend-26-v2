services:
  api1:
    image: ghcr.io/steixeira93/rinha-backend-26-v2-native:sha-dc7a9fbe49cbb57e0e76b6b6dad7cba7674c6a9c@sha256:5a24b2990f0fc5985dd72c8673caa1214043ec2b3eb0084f0c0882c32210b424
    platform: linux/amd64
    command: ["server"]
    environment:
      LISTEN: /sockets/api1.sock
      INDEX_PATH: /index/index.bin
      NPROBE: "20"
      FAST_NPROBE: "1"
      ADAPTIVE_MIN: "2"
      ADAPTIVE_MAX: "4"
      EXTREME0_WORST_THRESHOLD: "${EXTREME0_WORST_THRESHOLD:-3501932}"
      EXTREME1_WORST_THRESHOLD: "${EXTREME1_WORST_THRESHOLD:-3569273}"
      EXTREME2_WORST_THRESHOLD: "${EXTREME2_WORST_THRESHOLD:-2906420}"
      EXTREME3_WORST_THRESHOLD: "${EXTREME3_WORST_THRESHOLD:-2738652}"
      EXTREME4_WORST_THRESHOLD: "${EXTREME4_WORST_THRESHOLD:-3297753}"
      EXTREME5_WORST_THRESHOLD: "${EXTREME5_WORST_THRESHOLD:-4594089}"
      REPAIR_MIN: "99"
      REPAIR_MAX: "0"
      INDEX_MMAP: "1"
      MALLOC_ARENA_MAX: "1"
    volumes:
      - sockets:/sockets

  api2:
    image: ghcr.io/steixeira93/rinha-backend-26-v2-native:sha-dc7a9fbe49cbb57e0e76b6b6dad7cba7674c6a9c@sha256:5a24b2990f0fc5985dd72c8673caa1214043ec2b3eb0084f0c0882c32210b424
    platform: linux/amd64
    command: ["server"]
    environment:
      LISTEN: /sockets/api2.sock
      INDEX_PATH: /index/index.bin
      NPROBE: "20"
      FAST_NPROBE: "1"
      ADAPTIVE_MIN: "2"
      ADAPTIVE_MAX: "4"
      EXTREME0_WORST_THRESHOLD: "${EXTREME0_WORST_THRESHOLD:-3501932}"
      EXTREME1_WORST_THRESHOLD: "${EXTREME1_WORST_THRESHOLD:-3569273}"
      EXTREME2_WORST_THRESHOLD: "${EXTREME2_WORST_THRESHOLD:-2906420}"
      EXTREME3_WORST_THRESHOLD: "${EXTREME3_WORST_THRESHOLD:-2738652}"
      EXTREME4_WORST_THRESHOLD: "${EXTREME4_WORST_THRESHOLD:-3297753}"
      EXTREME5_WORST_THRESHOLD: "${EXTREME5_WORST_THRESHOLD:-4594089}"
      REPAIR_MIN: "99"
      REPAIR_MAX: "0"
      INDEX_MMAP: "1"
      MALLOC_ARENA_MAX: "1"
    volumes:
      - sockets:/sockets

  lb:
    image: haproxy:2.9-alpine
    ports:
      - "3457:9999"
    volumes:
      - sockets:/sockets:ro
      - ./haproxy-gate.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - api1
      - api2

volumes:
  sockets:
