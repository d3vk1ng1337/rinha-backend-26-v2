services:
  api1:
    image: ghcr.io/steixeira93/rinha-backend-26-v2-api:sha-6ec439096554f2a78e6240c5fb5cd63992a1f92a@sha256:6344b5721ffd1ee5fca1ecc2f75ddc620c22165717f168424508609969e95c23
    command: ["/sockets/api1.sock", "/index/index.bin", "1"]
    volumes:
      - sockets:/sockets
    security_opt:
      - seccomp:unconfined
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  api2:
    image: ghcr.io/steixeira93/rinha-backend-26-v2-api:sha-6ec439096554f2a78e6240c5fb5cd63992a1f92a@sha256:6344b5721ffd1ee5fca1ecc2f75ddc620c22165717f168424508609969e95c23
    command: ["/sockets/api2.sock", "/index/index.bin", "1"]
    volumes:
      - sockets:/sockets
    security_opt:
      - seccomp:unconfined
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  lb:
    image: ghcr.io/steixeira93/rinha-backend-26-v2-lb:sha-6ec439096554f2a78e6240c5fb5cd63992a1f92a@sha256:5b8e86a418bdf7c662589fa5bc3347c3318ad04f4c6a131ff83dde42980d4fc6
    command: ["0.0.0.0:9999", "/sockets/api1.sock", "/sockets/api2.sock"]
    ports:
      - "9999:9999"
    volumes:
      - sockets:/sockets:ro
    depends_on: [api1, api2]
    security_opt:
      - seccomp:unconfined
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"

volumes:
  sockets:
