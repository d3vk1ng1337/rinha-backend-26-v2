services:
  api1:
    image: ghcr.io/steixeira93/rinha-backend-26-v2-api:sha-8e9458e251aa08a1500938d7c68a9a6e6f68832b@sha256:b097ce0da3d42ae0e265d6d1b8ac6d56352b0df349851df495d43ab853b52f38
    command: ["/sockets/api1.sock", "/index/index.bin", "1"]
    volumes:
      - sockets:/sockets
    security_opt:
      - seccomp:unconfined
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.42"
          memory: "160MB"

  api2:
    image: ghcr.io/steixeira93/rinha-backend-26-v2-api:sha-8e9458e251aa08a1500938d7c68a9a6e6f68832b@sha256:b097ce0da3d42ae0e265d6d1b8ac6d56352b0df349851df495d43ab853b52f38
    command: ["/sockets/api2.sock", "/index/index.bin", "1"]
    volumes:
      - sockets:/sockets
    security_opt:
      - seccomp:unconfined
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.42"
          memory: "160MB"

  lb:
    image: ghcr.io/steixeira93/rinha-backend-26-v2-lb:sha-8e9458e251aa08a1500938d7c68a9a6e6f68832b@sha256:65deaed2871a278e3c4c610c37944e8a09f4591b9b53eea480a6d7c67de23dba
    command: ["0.0.0.0:9999", "/sockets/api1.sock", "/sockets/api2.sock"]
    ports:
      - "9999:9999"
    volumes:
      - sockets:/sockets:ro
    depends_on: [api1, api2]
    security_opt:
      - seccomp:unconfined
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.16"
          memory: "30MB"

volumes:
  sockets:
