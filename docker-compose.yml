services:
  api1:
    image: ghcr.io/steixeira93/rinha-backend-26-v2-api:sha-32789b104a76e6c845a81e9709c7abbc89e622ae@sha256:29dc627738cab30e79d98046899caf1a74dc8d0fe900f4c46edc558561012213
    command: ["/sockets/api1.sock", "/index/index.bin", "1"]
    volumes:
      - sockets:/sockets
    security_opt:
      - seccomp:unconfined
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  api2:
    image: ghcr.io/steixeira93/rinha-backend-26-v2-api:sha-32789b104a76e6c845a81e9709c7abbc89e622ae@sha256:29dc627738cab30e79d98046899caf1a74dc8d0fe900f4c46edc558561012213
    command: ["/sockets/api2.sock", "/index/index.bin", "1"]
    volumes:
      - sockets:/sockets
    security_opt:
      - seccomp:unconfined
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  lb:
    image: ghcr.io/steixeira93/rinha-backend-26-v2-lb:sha-32789b104a76e6c845a81e9709c7abbc89e622ae@sha256:fcc71c3abc275a00237513bbb13553e232e1da4b22e3ad59fd041d5afc2de222
    command: ["0.0.0.0:9999", "/sockets/api1.sock", "/sockets/api2.sock"]
    ports:
      - "9999:9999"
    volumes:
      - sockets:/sockets:ro
    depends_on: [api1, api2]
    security_opt:
      - seccomp:unconfined
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"

volumes:
  sockets:
