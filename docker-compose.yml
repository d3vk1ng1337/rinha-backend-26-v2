services:
  api1:
    image: ghcr.io/steixeira93/rinha-backend-26-v2-api:sha-fbb4214cbccbed0d48b16540c864036eb036455a@sha256:3ae3656b39ffad7d2edb8d779bfd8d9b8c8b15449af5ac0cfcdf8b3981bec021
    command: ["/sockets/api1.sock", "/index/index.bin", "1"]
    volumes:
      - sockets:/sockets
    security_opt:
      - seccomp:unconfined
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.42"
          memory: "160MB"

  api2:
    image: ghcr.io/steixeira93/rinha-backend-26-v2-api:sha-fbb4214cbccbed0d48b16540c864036eb036455a@sha256:3ae3656b39ffad7d2edb8d779bfd8d9b8c8b15449af5ac0cfcdf8b3981bec021
    command: ["/sockets/api2.sock", "/index/index.bin", "1"]
    volumes:
      - sockets:/sockets
    security_opt:
      - seccomp:unconfined
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.42"
          memory: "160MB"

  lb:
    image: ghcr.io/steixeira93/rinha-backend-26-v2-lb:sha-fbb4214cbccbed0d48b16540c864036eb036455a@sha256:a3c687d4c7acec6877e97820bb4d9957a3d6cf2a34345ec33afb9b5914830083
    command: ["0.0.0.0:9999", "/sockets/api1.sock", "/sockets/api2.sock"]
    ports:
      - "9999:9999"
    volumes:
      - sockets:/sockets:ro
    depends_on: [api1, api2]
    security_opt:
      - seccomp:unconfined
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.16"
          memory: "30MB"

volumes:
  sockets:
