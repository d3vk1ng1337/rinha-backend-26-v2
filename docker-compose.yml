services:
  api1:
    image: ghcr.io/steixeira93/rinha-backend-26-v2-api:sha-c452bfb4276ecf4231c4b5f202d8d14ee601696f@sha256:2b85135968a37251abcb241920bad7c8bd83d7e2d830b82847444e37e094fbc4
    command: ["/sockets/api1.sock", "/index/index.bin", "1"]
    volumes:
      - sockets:/sockets
    security_opt:
      - seccomp:unconfined
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.42"
          memory: "160MB"

  api2:
    image: ghcr.io/steixeira93/rinha-backend-26-v2-api:sha-c452bfb4276ecf4231c4b5f202d8d14ee601696f@sha256:2b85135968a37251abcb241920bad7c8bd83d7e2d830b82847444e37e094fbc4
    command: ["/sockets/api2.sock", "/index/index.bin", "1"]
    volumes:
      - sockets:/sockets
    security_opt:
      - seccomp:unconfined
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.42"
          memory: "160MB"

  lb:
    image: ghcr.io/steixeira93/rinha-backend-26-v2-lb:sha-c452bfb4276ecf4231c4b5f202d8d14ee601696f@sha256:656cc61e72622f3578ced2c42a4e31a10a09c11622578dec375f2299a1754c30
    command: ["0.0.0.0:9999", "/sockets/api1.sock", "/sockets/api2.sock"]
    ports:
      - "9999:9999"
    volumes:
      - sockets:/sockets:ro
    depends_on: [api1, api2]
    security_opt:
      - seccomp:unconfined
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.16"
          memory: "30MB"

volumes:
  sockets:
